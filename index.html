// 音
let ac,osc,gain;
function initAudio(){if(ac)return;try{ac=new (window.AudioContext||window.webkitAudioContext)();osc=ac.createOscillator();gain=ac.createGain();osc.type='sawtooth';gain.gain.value=0;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=900;osc.connect(f);f.connect(gain);gain.connect(ac.destination);osc.start()}catch(e){}}
function chime(n){if(!ac)return;const base=[523,659,784,1047];base.forEach((fr,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=fr*(1+n*0.06);g.gain.setValueAtTime(0,ac.currentTime+i*.07);g.gain.linearRampToValueAtTime(.15,ac.currentTime+i*.07+.01);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+i*.07+.6);o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+i*.07);o.stop(ac.currentTime+i*.07+.7)})}

function down(e){e.preventDefault();initAudio();hold=true;pend+=Math.PI/2;if(!started){started=true;hint.style.opacity=0}}
function up(){hold=false}
cv.addEventListener('pointerdown',down);addEventListener('pointerup',up);addEventListener('pointercancel',up);

function drawFig(cx,cy,s,a,col,lw,glow){
 const n=((Math.round(a/(Math.PI/4))%8)+8)%8,o=FR[n];if(!o.c.width)return;
 const h=380*s,w=h*o.c.width/o.c.height;
 x.save();x.translate(cx,cy-60*s);
 if(col!=='#111'&&lw>0){const b=tint(o,'#000'),k=Math.max(2,3*s);for(let i=0;i<8;i++){const q=i*Math.PI/4;x.drawImage(b,-w/2+Math.cos(q)*k,-h/2+Math.sin(q)*k,w,h)}}
 if(glow){x.shadowColor=col;x.shadowBlur=glow}
 x.drawImage(tint(o,col),-w/2,-h/2,w,h);x.restore();
}

 vel*=Math.pow(0.55,dt);vel=Math.min(vel,1.2+stage*0.25);
 const st=pend*Math.min(1,dt*16);pend-=st;
 if(!hold&&vel<0.02&&pend<0.001){const q=Math.PI/2,n=Math.ceil(ang/q-1e-3)*q;ang+=(n-ang)*Math.min(1,dt*12);vel=0}
 const d=vel+st;ang+=d;rot+=d/(Math.PI*2);spd=spd*0.8+d*0.2;
 while(stage<ST.length-1&&rot>=ST[stage+1]){stage++;banner=2.2;bannerTxt=NAME[stage];flash=1;chime(stage)}
 if(gain&&ac)gain.gain.setTargetAtTime(Math.min(spd*0.3,0.08),ac.currentTime,.05),osc.frequency.setTargetAtTime(60+spd*600,ac.currentTime,.05);

 const cx=W/2,cy=H*0.56+50,s=Math.min(W,H)/560;
 let shx=0,shy=0;if(stage>=8){const k=Math.min(spd*12,8+stage);shx=(Math.random()-.5)*k;shy=(Math.random()-.5)*k}
 x.save();x.translate(shx,shy);

 // 背景
 if(stage>=8){x.fillStyle=`hsl(${(t*40)%360},60%,6%)`}else x.fillStyle='#fff';
 x.fillRect(-20,-20,W+40,H+40);
 if(stage>=8){for(let i=0;i<80;i++){const r=(i*97+t*60*(1+i%5))%Math.max(W,H);const a2=i*2.399;x.fillStyle='#fff';x.globalAlpha=.6;x.fillRect(cx+Math.cos(a2)*r,cy+Math.sin(a2)*r,2,2)}x.globalAlpha=1}
 if(stage>=4){const n=stage>=9?36:18,R=Math.max(W,H);x.save();x.translate(cx,cy-60*s);x.rotate(t*(0.3+spd*1.5));
  for(let i=0;i<n;i++){x.beginPath();x.moveTo(0,0);x.arc(0,0,R,i/n*Math.PI*2,(i+.5)/n*Math.PI*2);x.closePath();x.fillStyle=stage>=8?`hsla(${i*360/n+t*90},100%,55%,.35)`:(i%2?'#ffe26a':'#fff3b0');x.fill()}
  x.restore()}
 if(stage>=3){const g=x.createRadialGradient(cx,cy-60*s,10,cx,cy-60*s,260*s*(1+stage*.08));g.addColorStop(0,`hsla(${t*200%360},100%,70%,.55)`);g.addColorStop(1,'hsla(0,0%,100%,0)');x.fillStyle=g;x.fillRect(0,0,W,H)}

 // 分身
 if(stage>=7){const n=stage>=10?12:stage>=9?8:5;for(let i=0;i<n;i++){const a2=i/n*Math.PI*2+t*(0.8+spd*1);const rr=(200+40*Math.sin(t*2))*s*(stage>=9?1.4:1);
  drawFig(cx+Math.cos(a2)*rr,cy+Math.sin(a2)*rr*.55,s*.35,ang+i,hue(i*40),6,stage>=6?15:0)}}

 // 残像
 const col=stage>=3?hue(0):'#111';
 if(stage>=1){const k=stage>=2?5:2;for(let i=k;i>0;i--){x.globalAlpha=.12*(k-i+1)/k;drawFig(cx,cy,s,ang-spd*i*1.5,stage>=3?hue(i*30):'#111',6,0,1)}x.globalAlpha=1}
 // 本体
 const big=stage>=10?1.15+Math.sin(t*8)*.05:1;
 drawFig(cx,cy,s*big,ang,col,stage>=6?8:6,stage>=6?30+Math.sin(t*10)*15:0);
 if(stage>=6){x.globalAlpha=.35;drawFig(cx,cy,s*big,ang,'#fff',0,0);x.globalAlpha=1}

 // キラキラ
 if(stage>=5&&spd>.03){for(let i=0;i<stage-3;i++)parts.push({x:cx+10,y:cy-80*s+30,vx:(Math.random()-.5)*600*s,vy:(Math.random()-.8)*600*s,l:1,h:Math.random()*360})}
 parts=parts.filter(p=>(p.l-=dt*.8)>0);
 for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*s*dt;x.save();x.translate(p.x,p.y);x.rotate(t*5);x.globalAlpha=p.l;x.fillStyle=`hsl(${p.h},100%,65%)`;
  x.beginPath();for(let j=0;j<10;j++){const r=j%2?4:11;x.lineTo(Math.cos(j*Math.PI/5)*r*s*1.5,Math.sin(j*Math.PI/5)*r*s*1.5)}x.fill();x.restore()}
 if(parts.length>600)parts.splice(0,parts.length-600);
 x.restore();

 // 弾幕コメント
 cmT-=dt;if(started&&cmT<=0){cmT=Math.max(0.35,2.6-stage*0.2)*(0.6+Math.random());const n=stage>=8?2:1;for(let i=0;i<n;i++){const fs=Math.min(W/14,40)*(0.7+Math.random()*0.6);cm.push({t:CMT[Math.random()*CMT.length|0],x:W+20,y:40+Math.random()*(H-120),v:(180+Math.random()*180)*(1+stage*.08),fs,cv:Math.random()<.35?(Math.random()<.5?1:-1):0,a:0,h:Math.random()*360})}}
 x.textBaseline='middle';x.textAlign='left';x.lineJoin='round';
 for(const c of cm){c.x-=c.v*dt;c.a+=dt;let yy=c.y;if(c.cv){yy+=Math.sin(c.a*3)*60*c.cv-c.a*c.a*40*c.cv}
  x.font=`900 ${c.fs}px "Hiragino Maru Gothic ProN","M PLUS Rounded 1c",sans-serif`;x.lineWidth=5;x.strokeStyle='#000';x.strokeText(c.t,c.x,yy);x.fillStyle=stage>=3?`hsl(${c.h+t*200},100%,65%)`:'#fff';x.fillText(c.t,c.x,yy)}
 cm=cm.filter(c=>c.x>-c.fs*c.t.length-40);
 // フラッシュ
 if(flash>0){x.fillStyle=`rgba(255,255,255,${flash*.8})`;x.fillRect(0,0,W,H);flash-=dt*2.5}
 // 段階テロップ
 if(banner>0){banner-=dt;const a=Math.min(1,banner*2),sc=1+Math.max(0,banner-1.9)*3;x.save();x.globalAlpha=a;x.translate(W/2,H*.17);x.scale(sc,sc);
  x.font=`900 ${Math.min(W/9,64)}px "Hiragino Maru Gothic ProN","M PLUS Rounded 1c",sans-serif`;x.textAlign='center';x.textBaseline='middle';
  x.lineWidth=8;x.strokeStyle='#000';x.strokeText(bannerTxt,0,0);x.fillStyle=stage>=3?hue(0):'#fff';x.fillText(bannerTxt,0,0);x.restore()}
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
